<div class="flr-md-editor__frame" [class.flr-md-editor__frame--disabled]="disabled()">
  <div class="flr-md-editor__head">
    <flr-tabs mode="panel" [ariaLabel]="resolvedLabels().editorMode">
      <flr-tab
        [label]="resolvedLabels().write"
        [active]="!previewing()"
        [panelId]="writeId"
        (selected)="mode.set('write')"
      />
      <flr-tab
        [label]="resolvedLabels().preview"
        [active]="previewing()"
        [panelId]="previewId"
        (selected)="mode.set('preview')"
      />
    </flr-tabs>
    <div
      class="flr-md-editor__toolbar"
      role="group"
      [attr.aria-label]="resolvedLabels().formatting"
      [attr.aria-controls]="writeId"
      [hidden]="previewing()"
    >
      @for (action of actions; track action.id) {
        <flr-button
          variant="ghost"
          size="sm"
          [aria-label]="resolvedLabels()[action.label]"
          [disabled]="disabled()"
          (pressed)="run(action)"
        >
          <span
            class="flr-md-editor__glyph"
            aria-hidden="true"
            [style]="action.style"
            [attr.data-glyph]="action.glyph"
          ></span>
        </flr-button>
      }
    </div>
  </div>

  <div
    [id]="writeId"
    role="tabpanel"
    [attr.aria-label]="resolvedLabels().write"
    [hidden]="previewing()"
  >
    <textarea
      #textarea
      class="flr-md-editor__input"
      [rows]="rows()"
      [style.min-height]="minHeight()"
      [value]="written()"
      [disabled]="disabled()"
      [attr.placeholder]="placeholder()"
      [attr.aria-label]="ariaLabel() ?? resolvedLabels().editor"
      (input)="handleInput($event)"
      (keydown)="handleKeydown($event)"
      (blur)="handleBlur()"
    ></textarea>
  </div>

  <div
    [id]="previewId"
    role="tabpanel"
    [attr.aria-label]="resolvedLabels().preview"
    class="flr-md-editor__preview"
    [style.min-height]="minHeight()"
    [hidden]="!previewing()"
  >
    @if (previewing()) {
      @if (value().trim()) {
        <flr-markdown [source]="value()" />
      } @else {
        <p class="flr-md-editor__empty">{{ resolvedLabels().nothingToPreview }}</p>
      }
    }
  </div>
</div>
