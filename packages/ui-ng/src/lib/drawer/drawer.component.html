<ng-template #panel>
  <div
    class="flr-drawer__panel"
    [class.flr-drawer__panel--left]="side() === 'left'"
    [class.flr-drawer__panel--right]="side() === 'right'"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title() ? titleId : null"
    [style.width.px]="width()"
  >
    @if (title() || closeLabel()) {
      <div class="flr-drawer__head">
        @if (title(); as t) {
          <h2 class="flr-drawer__title" [id]="titleId">{{ t }}</h2>
        }
        @if (closeLabel(); as label) {
          <button
            type="button"
            class="flr-drawer__close"
            [attr.aria-label]="label"
            (click)="closed.emit()"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m6 6 12 12M6 18 18 6" />
            </svg>
          </button>
        }
      </div>
    }
    <div class="flr-drawer__body"><ng-content /></div>
    <div class="flr-drawer__footer"><ng-content select="[drawer-footer]" /></div>
  </div>
</ng-template>
