<div #group class="flr-seg" role="radiogroup" [attr.aria-label]="ariaLabel()">
  <span #thumb class="flr-seg__thumb" aria-hidden="true" hidden></span>
  @for (option of options(); track option.value; let i = $index) {
    @let selected = option.value === value();
    <button
      #optionButton
      type="button"
      role="radio"
      class="flr-seg__option"
      [class.flr-seg__option--selected]="selected"
      [class.flr-seg__option--icon-only]="iconOnly() && option.icon"
      [attr.aria-checked]="selected"
      [attr.aria-label]="iconOnly() && option.icon ? option.label : null"
      [attr.title]="iconOnly() && option.icon ? option.label : null"
      [tabindex]="selected ? 0 : -1"
      (click)="select(option)"
      (keydown)="handleKeydown($event, i)"
    >
      @let icon = trustedIcon(option.icon);
      @if (icon) {
        <span class="flr-seg__icon" aria-hidden="true" [innerHTML]="icon"></span>
      }
      @if (!iconOnly() || !icon) {
        <span>{{ option.label }}</span>
      }
    </button>
  }
</div>
