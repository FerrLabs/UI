<div class="flr-as" [class.flr-as--collapsed]="compact()">
  <button
    type="button"
    #trigger
    class="flr-as__trigger"
    [attr.aria-label]="triggerLabel()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    [style.--flr-as-accent]="currentItem()?.accent ?? null"
    (click)="toggle()"
  >
    @if (currentItem(); as item) {
      <span class="flr-as__mark" aria-hidden="true">
        <flr-logo-mark [product]="glyph(item)" [accent]="markColor(item)" [size]="26" />
      </span>
      <span class="flr-as__text" [attr.aria-hidden]="compact() || null">
        <span class="flr-as__name">{{ item.label }}</span>
        <span class="mono flr-as__caption">{{ caption() }}</span>
      </span>
    }
    <span class="flr-as__chevron" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path d="m7 9.5 5-5 5 5" />
        <path d="m7 14.5 5 5 5-5" />
      </svg>
    </span>
  </button>

  @if (open()) {
    <div class="flr-as__panel" animate.leave="flr-as__panel--leaving" [id]="panelId">
      <div class="flr-as__panel-head">
        <p class="mono flr-as__panel-title">{{ listLabel() }}</p>
        <button
          type="button"
          class="flr-as__customize"
          [attr.aria-label]="customizeLabel()"
          [title]="customizeLabel()"
          (click)="openCustomize()"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            aria-hidden="true"
          >
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>

      @for (item of visibleItems(); track item.id) {
        <a
          class="flr-as__item"
          [class.flr-as__item--current]="item.id === current()"
          [href]="item.href"
          [style.--flr-as-accent]="item.accent"
          [attr.aria-current]="item.id === current() ? 'page' : null"
          [attr.target]="item.newTab ? '_blank' : null"
          [attr.rel]="item.newTab ? 'noreferrer noopener' : null"
          (click)="onSelect(item)"
        >
          <span class="flr-as__mark" aria-hidden="true">
            <flr-logo-mark [product]="glyph(item)" [accent]="markColor(item)" [size]="19" />
          </span>
          <span class="flr-as__text">
            <span class="flr-as__name">{{ item.label }}</span>
            @if (item.meta) {
              <span class="mono flr-as__meta">{{ item.meta }}</span>
            }
          </span>
          @if (item.id === current()) {
            <span class="flr-as__check" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <path d="m5 12.5 4.5 4.5L19 7.5" />
              </svg>
            </span>
          }
        </a>
      }

      <div class="flr-as__footer"><ng-content select="[switcher-footer]" /></div>
    </div>
  }
</div>

<flr-modal
  [open]="customizing()"
  [title]="customizeLabel()"
  [description]="customizeHint()"
  size="sm"
  (closed)="customizing.set(false)"
>
  <ul class="flr-as__toggles">
    @for (item of items(); track item.id) {
      <li>
        <flr-switch
          [label]="item.label"
          [hint]="item.meta ?? null"
          [ngModel]="isShown(item)"
          [disabled]="isLocked(item)"
          (ngModelChange)="setShown(item, $event)"
        />
      </li>
    }
  </ul>
  <div modal-footer>
    <flr-button (pressed)="customizing.set(false)">{{ doneLabel() }}</flr-button>
  </div>
</flr-modal>
