<div class="flr-as" [class.flr-as--collapsed]="compact()">
  <button
    type="button"
    #trigger
    class="flr-as__trigger"
    [attr.aria-label]="triggerLabel()"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    [style.--flr-as-accent]="currentItem()?.accent ?? null"
    (click)="toggle()"
  >
    @if (currentItem(); as item) {
      <span class="flr-as__mark" aria-hidden="true">
        <flr-logo-mark [product]="glyph(item)" [accent]="markColor(item)" [size]="21" />
      </span>
      @if (!compact()) {
        <span class="flr-as__text">
          <span class="flr-as__name">{{ item.label }}</span>
          <span class="mono flr-as__caption">{{ caption() }}</span>
        </span>
      }
    }
    @if (!compact()) {
      <span class="flr-as__chevron" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="4.5 6.5 8 3 11.5 6.5" />
          <polyline points="4.5 9.5 8 13 11.5 9.5" />
        </svg>
      </span>
    }
  </button>

  @if (open()) {
    <div class="flr-as__panel" [id]="panelId">
      <div class="flr-as__panel-head">
        <p class="mono flr-as__panel-title">{{ listLabel() }}</p>
        <button
          type="button"
          class="flr-as__customize"
          [attr.aria-label]="customizeLabel()"
          [title]="customizeLabel()"
          (click)="openCustomize()"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path
              d="M10.3 3.6a1 1 0 0 1 1-.8h1.4a1 1 0 0 1 1 .8l.3 1.7a7 7 0 0 1 1.6.9l1.6-.6a1 1 0 0 1 1.2.4l.7 1.2a1 1 0 0 1-.2 1.3l-1.3 1.1a7 7 0 0 1 0 1.8l1.3 1.1a1 1 0 0 1 .2 1.3l-.7 1.2a1 1 0 0 1-1.2.4l-1.6-.6a7 7 0 0 1-1.6.9l-.3 1.7a1 1 0 0 1-1 .8h-1.4a1 1 0 0 1-1-.8l-.3-1.7a7 7 0 0 1-1.6-.9l-1.6.6a1 1 0 0 1-1.2-.4l-.7-1.2a1 1 0 0 1 .2-1.3l1.3-1.1a7 7 0 0 1 0-1.8L4.9 9.1a1 1 0 0 1-.2-1.3l.7-1.2a1 1 0 0 1 1.2-.4l1.6.6a7 7 0 0 1 1.6-.9z"
            />
            <circle cx="12" cy="12" r="2.6" />
          </svg>
        </button>
      </div>

      @for (item of visibleItems(); track item.id) {
        <a
          class="flr-as__item"
          [class.flr-as__item--current]="item.id === current()"
          [href]="item.href"
          [style.--flr-as-accent]="item.accent"
          [attr.aria-current]="item.id === current() ? 'page' : null"
          [attr.target]="item.newTab ? '_blank' : null"
          [attr.rel]="item.newTab ? 'noreferrer noopener' : null"
          (click)="onSelect(item)"
        >
          <span class="flr-as__mark" aria-hidden="true">
            <flr-logo-mark [product]="glyph(item)" [accent]="markColor(item)" [size]="19" />
          </span>
          <span class="flr-as__text">
            <span class="flr-as__name">{{ item.label }}</span>
            @if (item.meta) {
              <span class="mono flr-as__meta">{{ item.meta }}</span>
            }
          </span>
          @if (item.id === current()) {
            <span class="flr-as__check" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 8.5 6.5 12 13 4" />
              </svg>
            </span>
          }
        </a>
      }

      <div class="flr-as__footer"><ng-content select="[switcher-footer]" /></div>
    </div>
  }
</div>

<flr-modal
  [open]="customizing()"
  [title]="customizeLabel()"
  [description]="customizeHint()"
  size="sm"
  (closed)="customizing.set(false)"
>
  <ul class="flr-as__toggles">
    @for (item of items(); track item.id) {
      <li>
        <flr-switch
          [label]="item.label"
          [hint]="item.meta ?? null"
          [ngModel]="isShown(item)"
          [disabled]="isLocked(item)"
          (ngModelChange)="setShown(item, $event)"
        />
      </li>
    }
  </ul>
  <div modal-footer>
    <flr-button (pressed)="customizing.set(false)">{{ doneLabel() }}</flr-button>
  </div>
</flr-modal>
