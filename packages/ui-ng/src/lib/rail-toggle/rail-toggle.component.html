<button
  type="button"
  class="flr-rail-toggle"
  [class.flr-rail-toggle--collapsed]="collapsed()"
  [attr.aria-label]="label()"
  [attr.aria-expanded]="!collapsed()"
  [attr.title]="label()"
  (click)="toggle()"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <rect x="3" y="4" width="18" height="16" rx="3" />
    <rect
      class="flr-rail-toggle__panel"
      x="3"
      y="4"
      width="7"
      height="16"
      fill="currentColor"
      fill-opacity="0.18"
      stroke="none"
    />
    <line class="flr-rail-toggle__panel" x1="10" y1="4" x2="10" y2="20" />
  </svg>
</button>
