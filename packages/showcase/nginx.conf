server {
    listen 8080;
    root /usr/share/nginx/html;

    # Interne VPN-only : pas d'indexation.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Storybook (Vite) a besoin d'inline + eval + blob/data pour son runtime
    # et le rendu des stories. CSP volontairement permissive — site interne.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; base-uri 'self'" always;

    # Bundle statique Storybook (index.html, iframe.html, assets/…).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
