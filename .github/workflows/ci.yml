name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Typecheck
    runs-on: ferrlabs-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Resolve change-aware filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE" --depth=1 --quiet || true
            echo "filter=...[origin/${BASE}]" >> "$GITHUB_OUTPUT"
            echo "PR vs origin/${BASE}"
          elif [ "$EVENT" = "push" ]; then
            echo "filter=...[HEAD~1]" >> "$GITHUB_OUTPUT"
            echo "push vs HEAD~1"
          else
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — full workspace"
          fi
      - name: Build library packages
        # ui-ng and ui-astro both resolve @ferrlabs/ui-foundation through its
        # dist/ exports, so the topological order matters. Use
        # `pnpm -r --workspace-concurrency=1` rather than enumerating filters
        # (which is what historically broke whenever a new package landed —
        # UI#105).
        run: pnpm -r --workspace-concurrency=1 build
      - name: Typecheck
        env:
          FILTER: ${{ steps.filter.outputs.filter }}
        run: |
          if [ -n "$FILTER" ]; then
            pnpm --filter "$FILTER" typecheck
          else
            pnpm -r typecheck
          fi

  release:
    name: Release with FerrFlow
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: FerrLabs/.github/.github/workflows/reusable-ferrflow-release.yml@79e493a34b510b62b1d2d194e99553d229f81faf # main
    secrets: inherit
