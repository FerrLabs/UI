name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Typecheck
    runs-on: ferrlabs-k8s
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Resolve change-aware filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE" --depth=1 --quiet || true
            echo "filter=...[origin/${BASE}]" >> "$GITHUB_OUTPUT"
            echo "PR vs origin/${BASE}"
          elif [ "$EVENT" = "push" ]; then
            echo "filter=...[HEAD~1]" >> "$GITHUB_OUTPUT"
            echo "push vs HEAD~1"
          else
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — full workspace"
          fi
      - name: Build library packages (deps for showcase typecheck)
        # Build foundation first — ui-icons / ui-styles / ui-tailwind are now
        # re-export shells that depend on it. ui (meta-package) re-exports
        # primitives + react. Use `pnpm -r --workspace-concurrency=1` so the
        # topological order is respected end-to-end without enumerating each
        # filter (which is what historically broke whenever a new package
        # landed — UI#105).
        run: pnpm -r --workspace-concurrency=1 build
      - name: Typecheck
        env:
          FILTER: ${{ steps.filter.outputs.filter }}
        run: |
          if [ -n "$FILTER" ]; then
            pnpm --filter "$FILTER" typecheck
          else
            pnpm -r typecheck
          fi

  release:
    name: Release with FerrFlow
    needs: check
    runs-on: ferrlabs-k8s
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: FerrLabs/FerrFlow@v5
        with:
          bot: true
