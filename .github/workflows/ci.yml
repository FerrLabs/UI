name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Typecheck
    runs-on: ${{ github.event.repository.private && 'ferrlabs-k8s' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve change-aware filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE" --depth=1 --quiet || true
            echo "filter=...[origin/${BASE}]" >> "$GITHUB_OUTPUT"
            echo "PR vs origin/${BASE}"
          elif [ "$EVENT" = "push" ]; then
            echo "filter=...[HEAD~1]" >> "$GITHUB_OUTPUT"
            echo "push vs HEAD~1"
          else
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — full workspace"
          fi
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Build library packages
        # ui-ng resolves @ferrlabs/ui-foundation through its dist/ exports, so
        # the topological order matters. Use
        # `pnpm -r --workspace-concurrency=1` rather than enumerating filters
        # (which is what historically broke whenever a new package landed —
        # UI#105).
        run: pnpm -r --workspace-concurrency=1 build
      - name: Typecheck
        env:
          FILTER: ${{ steps.filter.outputs.filter }}
        run: |
          if [ -n "$FILTER" ]; then
            pnpm --filter "$FILTER" typecheck
          else
            pnpm -r typecheck
          fi

  a11y:
    name: Storybook accessibility
    runs-on: ${{ github.event.repository.private && 'ferrlabs-k8s' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @ferrlabs/ui-showcase exec playwright install --with-deps chromium
      - name: Build Storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter "@ferrlabs/ui-showcase..." build
      - name: Run accessibility tests
        run: |
          pnpm --filter @ferrlabs/ui-showcase exec concurrently -k -s first -n sb,test             "npx http-server dist -p 6006"             "npx wait-on http-get://127.0.0.1:6006/index.json && pnpm --filter @ferrlabs/ui-showcase test:ci"

  release:
    name: Release with FerrFlow
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: FerrLabs/.github/.github/workflows/reusable-ferrflow-release.yml@dc37316d0b31cb7a47455f2933202533f9c909bd # main
    secrets: inherit
