name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (omit to republish all)
        required: false
        type: string

jobs:
  resolve:
    name: Resolve packages
    runs-on: ferrlabs-k8s
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
      - id: pick
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.package }}
        run: |
          if [ -n "$TAG" ]; then
            pkg="${TAG%%@*}"
            echo "packages=[\"$pkg\"]" >> "$GITHUB_OUTPUT"
            echo "Release tag $TAG â†’ publish $pkg"
          elif [ -n "$INPUT" ]; then
            echo "packages=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch â†’ publish $INPUT"
          else
            echo 'packages=["foundation","ui-ng"]' >> "$GITHUB_OUTPUT"
            echo "Manual dispatch (no input) â†’ publish all"
          fi

  publish:
    name: Publish ${{ matrix.package }}
    needs: resolve
    runs-on: ferrlabs-k8s
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.resolve.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@ferrlabs'
          cache: pnpm
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Build package (with workspace deps)
        # Use --filter '...^@ferrlabs/ui-foo' to build the package AND its
        # workspace dependencies first. Required since UI#105 introduced
        # re-export shells (ui-icons â†’ ui-foundation, ui â†’ primitives + react)
        # â€” building the shell alone fails without the upstream's dist.
        run: |
          pkg_name=$(node -p "require('./packages/${{ matrix.package }}/package.json').name")
          pnpm --filter "...$pkg_name" build || echo "no build step"
      - name: Publish
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pubdir="."
          if [ -f ng-package.json ] && [ -f dist/package.json ]; then
            pubdir="dist"
          fi
          current=$(node -p "require('./${pubdir}/package.json').version")
          name=$(node -p "require('./${pubdir}/package.json').name")
          if npm view "$name@$current" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Already published: $name@$current â€” skipping"
            exit 0
          fi
          cd "$pubdir" && pnpm publish --no-git-checks --access restricted
