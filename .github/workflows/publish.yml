name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (omit to republish all)
        required: false
        type: string

jobs:
  resolve:
    name: Resolve packages
    runs-on: ferrlabs-k8s
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
      - id: pick
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.package }}
        run: |
          if [ -n "$TAG" ]; then
            pkg="${TAG%%@*}"
            echo "packages=[\"$pkg\"]" >> "$GITHUB_OUTPUT"
            echo "Release tag $TAG → publish $pkg"
          elif [ -n "$INPUT" ]; then
            echo "packages=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch → publish $INPUT"
          else
            echo 'packages=["foundation","primitives","react","astro","auth","ui"]' >> "$GITHUB_OUTPUT"
            echo "Manual dispatch (no input) → publish all"
          fi

  publish:
    name: Publish ${{ matrix.package }}
    needs: resolve
    runs-on: ferrlabs-k8s
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.resolve.outputs.packages) }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@ferrlabs'
          cache: pnpm
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Build package (with workspace deps)
        # Use --filter '...^@ferrlabs/ui-foo' to build the package AND its
        # workspace dependencies first. Required since UI#105 introduced
        # re-export shells (ui-icons → ui-foundation, ui → primitives + react)
        # — building the shell alone fails without the upstream's dist.
        run: |
          pkg_name=$(node -p "require('./packages/${{ matrix.package }}/package.json').name")
          pnpm --filter "...$pkg_name" build || echo "no build step"
      - name: Publish
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$current" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Already published: $name@$current — skipping"
            exit 0
          fi
          pnpm publish --no-git-checks --access restricted

  notify-consumers:
    name: Notify consumers of new release
    needs: publish
    if: github.event_name == 'release'
    runs-on: ferrlabs-k8s
    steps:
      - name: Dispatch ferrlabs-package-published event
        env:
          # PAT with `repo` scope on each consumer repo. Configured as
          # FERRLABS_DISPATCH_TOKEN org-wide. Direct curl rather than `gh`
          # CLI because the self-hosted ferrlabs-k8s runner image doesn't
          # ship the GitHub CLI binary.
          DISPATCH_TOKEN: ${{ secrets.FERRLABS_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for repo in FerrLabs-Cloud FerrFlow-Cloud FerrVault-Cloud FerrTrack-Cloud FerrGrowth-Cloud FerrFleet-Cloud ; do
            echo "Dispatching to $repo..."
            http_code=$(curl -sS -o /tmp/dispatch-resp -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "{\"event_type\":\"ferrlabs-package-published\",\"client_payload\":{\"tag\":\"$TAG\",\"released_at\":\"$released_at\"}}" \
              "https://api.github.com/repos/FerrLabs/$repo/dispatches")
            if [ "$http_code" = "204" ]; then
              echo "  ✓ dispatched ($http_code)"
            else
              echo "  ✗ failed: HTTP $http_code"
              cat /tmp/dispatch-resp
              echo
            fi
          done
