name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (omit to republish all)
        required: false
        type: string

jobs:
  resolve:
    name: Resolve packages
    runs-on: ferrlabs-k8s
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
      - id: pick
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.package }}
        run: |
          if [ -n "$TAG" ]; then
            pkg="${TAG%%@*}"
            echo "packages=[\"$pkg\"]" >> "$GITHUB_OUTPUT"
            echo "Release tag $TAG → publish $pkg"
          elif [ -n "$INPUT" ]; then
            echo "packages=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch → publish $INPUT"
          else
            echo 'packages=["tailwind","icons","react","astro","auth","styles"]' >> "$GITHUB_OUTPUT"
            echo "Manual dispatch (no input) → publish all"
          fi

  publish:
    name: Publish ${{ matrix.package }}
    needs: resolve
    runs-on: ferrlabs-k8s
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.resolve.outputs.packages) }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@ferrlabs'
          cache: pnpm
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Build package
        working-directory: packages/${{ matrix.package }}
        run: pnpm build || echo "no build step"
      - name: Publish
        working-directory: packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$current" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Already published: $name@$current — skipping"
            exit 0
          fi
          pnpm publish --no-git-checks --access restricted

  notify-consumers:
    name: Notify consumers of new release
    needs: publish
    if: github.event_name == 'release'
    runs-on: ferrlabs-k8s
    steps:
      - name: Dispatch ferrlabs-package-published event
        env:
          # PAT with `repo` scope on each consumer repo. Set this as an org
          # secret named FERRLABS_DISPATCH_TOKEN with read+write to all the
          # FerrLabs/*-Cloud repos. Falls back to GITHUB_TOKEN which CANNOT
          # cross-repo dispatch — the fallback is here only to avoid breaking
          # the workflow before the secret is configured.
          GH_TOKEN: ${{ secrets.FERRLABS_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for repo in FerrLabs-Cloud FerrFlow-Cloud FerrVault-Cloud FerrTrack-Cloud FerrGrowth-Cloud FerrFleet-Cloud ; do
            echo "Dispatching to $repo..."
            gh api "repos/FerrLabs/$repo/dispatches" \
              -f "event_type=ferrlabs-package-published" \
              -f "client_payload[tag]=$TAG" \
              -f "client_payload[released_at]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              || echo "  (failed to dispatch to $repo — continuing)"
          done
